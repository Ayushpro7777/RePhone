<!DOCTYPE html>
<html>
<head>
    <title>Available Phones</title>
</head>
<body>
    <h2>Available Phones</h2>

    <!-- Filter Form -->
    <form method="get" action="/phones">
        <input type="text" name="location" placeholder="Enter your city" value="{{ request.args.get('location', '') }}">
        
        <select name="brand">
            <option value="">All Brands</option>
            <option value="Apple" {% if request.args.get('brand') == 'Apple' %}selected{% endif %}>Apple</option>
            <option value="Samsung" {% if request.args.get('brand') == 'Samsung' %}selected{% endif %}>Samsung</option>
            <option value="Google" {% if request.args.get('brand') == 'Google' %}selected{% endif %}>Google</option>
        </select>

        <input type="number" name="min_price" placeholder="Min Price" value="{{ request.args.get('min_price', '') }}">
        <input type="number" name="max_price" placeholder="Max Price" value="{{ request.args.get('max_price', '') }}">

        <button type="submit">Search</button>
    </form>

    <hr>

    <!-- Phones List -->
    {% for phone in phones %}
        <p>
            <b>{{ phone[2] }} {{ phone[1] }}</b><br>

            {% if phone|length > 5 and phone[5] %}
                <img src="{{ url_for('static', filename='uploads/' + phone[5]) }}" width="200"><br>
            {% endif %}

            Price: {{ phone[3] }}<br>
            Location: {{ phone[4] }}<br>

            <a href="/chat/{{ phone[0] }}">Chat</a>
        </p>
        <hr>
    {% endfor %}

    <a href="/sell">Sell Phone</a>
</body>
</html>
